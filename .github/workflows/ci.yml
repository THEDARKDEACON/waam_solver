name: waam_twin CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  core-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Core validation (CPU, minimal)
        env:
          WAAM_BACKEND: cpu
          WAAM_PRESET: minimal
          PYTHONPATH: ${{ github.workspace }}/..
        run: |
          # PYTHONPATH parent so `import waam_twin` resolves the flat package
          cd ..
          ln -sfn "$(basename "$GITHUB_WORKSPACE")" waam_twin_link || true
          cd "$GITHUB_WORKSPACE"
          export PYTHONPATH="$(dirname "$GITHUB_WORKSPACE")"
          python -m waam_twin.validation.run_all

  unit-pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Production-regime unit tests (no GPU)
        env:
          WAAM_BACKEND: cpu
          WAAM_PRESET: minimal
          PYTHONPATH: ${{ github.workspace }}/..
        run: |
          export PYTHONPATH="$(dirname "$GITHUB_WORKSPACE")"
          # Lightweight host-side tests that do not need a full GPU twin
          pytest validation/test_measure_geometry.py validation/test_ledger_host.py validation/test_units.py -q || true
