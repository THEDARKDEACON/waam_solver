# Calibrated ER70S-6 — literature-enriched tables (v2)
#
# Bump from v1: denser cp(T)/k(T)/μ(T) knots from mild-steel weld literature
# (ASM Handbook / Mills-order engineering fits). Surfactant model unchanged.
#
# Status: calibrated for property richness — NOT yet the locked twin job material.
# Keep jobs/examples/bead_calibrate.yaml on ER70S-6.v1 until FULL + held-out
# prediction_report is re-run and W/D stays within gate after switching.
#
# To promote:
#   1. Point bead_calibrate.yaml material → this file
#   2. WAAM_FULL_VALIDATION=1 + prediction_report
#   3. Update reference_case_ER70S6.md
name: ER70S-6
status: calibrated
source: "ER70S-6.v2 — literature cp/k/μ tables; process window still bead_calibrate v1 until re-locked"
notes: >
  Property upgrade only. Twin process lock (η, Goldak, C_acc) remains on v1 until
  a re-gate. Tables: mild-steel liquid/solid thermal properties spanning ambient
  → superheat; Sahoo Fe–S surfactant at S=28 ppm (Sahoo–DebRoy–McNallan 1988,
  Metall. Trans. B 19:483–491). Replace knots with DSC/laser-flash measurements
  for absolute accuracy claims.

