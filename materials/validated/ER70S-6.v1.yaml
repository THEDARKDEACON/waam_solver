# Calibrated ER70S-6 — bead-on-plate reference (v1)
#
# Process window (locked twin job):
#   jobs/examples/bead_calibrate.yaml — GMAW-style 100 A × 15 V, η=0.72,
#   travel 6.5 mm/s, Goldak + soft-onset CC recoil (C_acc=0.25).
# Macrograph target: pool W≈7 mm, D≈3 mm (simulator envelope ≈6.8×3.2).
#
# Status meaning:
#   calibrated = properties + surfactant model fixed for this process window and
#   used by credibility gates. Absolute handbook accuracy is not claimed; bump
#   to v2 when replacing tables with measured DSC/diffusivity data.
#
# Property sources (order-of-magnitude + weld-pool literature):
#   rho, L_fusion, T_sol/liq — mild-steel / ER70S-6 weld literature
#   cp(T), k(T) — piecewise knots bridging ambient → liquidus
#   dγ/dT + Sahoo surfactant — Sahoo–DebRoy–McNallan Fe–S (1988), S≈28 ppm
#   mu(T) — liquid steel viscosity trend near melting
# Do NOT load materials/placeholders/ER70S-6.yaml for publishable runs.
# Do NOT apply materials/calibration/ER70S-6.bead_on_plate.yaml (legacy η=0.65)
# on top of the locked calibrate job (η is embedded in the job process block).
name: ER70S-6
status: calibrated
source: "Bead-on-plate lock v1 — jobs/examples/bead_calibrate.yaml (macrograph 7×3 mm)"
notes: >
  Validated path for waam_twin credibility gates. Tables are engineering fits
  for the locked GMAW window, not a full thermophysical database. Held-out
  predictions must keep these properties fixed while varying process only.

constants:
  k: 30.0
  rho: 7000.0
  cp: 680.0
  alpha: 6.3e-6
  T_solidus: 1748.0
  T_liquidus: 1793.0
  L_fusion: 272000.0
  gamma_0: 1.8
  dgamma_dT: -4.3e-4
  T_ref_gamma: 1793.0
  mu: 0.0065
  beta_T: 1.2e-4

tables:
  cp:
    - [300, 650]
    - [1000, 680]
    - [1793, 720]
  k:
    - [300, 28]
    - [1000, 30]
    - [1793, 34]
  dgamma_dT:
    - [1793, -4.3e-4]
    - [2000, -3.8e-4]
  mu:
    - [300, 0.0075]
    - [1793, 0.0065]
    - [2000, 0.0055]

surface:
  contact_angle_deg: 80.0

surfactant:
  model: sahoo          # Sahoo/DebRoy γ(T,a_S); use "heiple" for static ppm scale
  sulphur_ppm: 28.0     # low-S ER70S-6 → outward Marangoni near liquidus

electrical:
  rho_e_ohm_m: 1.5e-7
  eta_stick: 0.85
