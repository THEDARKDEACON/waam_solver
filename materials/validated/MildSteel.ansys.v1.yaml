# Mild Steel — Ansys Mechanical 2024 R2 plate card (v1)
#
# Source, copied, not refitted:
#   Deposit_Study Engineering Data material "Mild Steel"
#   Deposit_Study_files/dp0/SYS/MECH/MatML.xml
#   and the properties actually sent to MAPDL in ds.dat (matid 1, body Plate):
#     MP,DENS  7.85e-09 tonne/mm^3  = 7850 kg/m^3
#     MPDATA,KXX   25 temperatures, W/m·°C
#     MPDATA,ENTH  25 temperatures, mJ/mm^3  (the curve the thermal solve integrates)
#     MPDATA,C     25 temperatures, specific heat
#     MP,VISC  6.7e-09 MPa·s = 0.0067 Pa·s
#   Solidus 1480 °C and liquidus 1520 °C are the temperatures where that
#   enthalpy slope leaves 650 J/kg·K and returns to it. Latent heat is
#     (H_1520 - H_1480)/rho - 650*40 = 260000 J/kg exactly.
#
# k(T) is all 25 Ansys knots. The twin has no enthalpy table, so cp(T) is the
# slope of MPDATA,ENTH on each Ansys interval, held flat across that interval.
# The 1480-1520 °C slope is 7150 J/kg·K because the latent heat sits in it;
# that jump stays in L_fusion and cp stays 650 there, so it is not counted twice.
# The Engineering Data specific-heat column spikes to 5000 J/kg·K at 735 °C.
# The enthalpy slope through that point peaks near 2400 J/kg·K. This card
# follows the enthalpy slope. A 5000 knot would add heat the Ansys solve
# did not absorb.
#
# 28 cp knots and 25 k knots. gpu_tables.MAX_KNOTS is 50.
#
# Not in the Ansys thermal card, and unused while Marangoni and buoyancy are
# off: gamma_0 and dgamma/dT are the pure-Fe slope in Sahoo, DebRoy and McNallan,
# Metall. Trans. B 19 (1988) 483-491 (gamma_m = 1.943 N/m, A = 4.3e-4 N/m·K).
# beta_T is the twin default 1.2e-4 1/K. Do not treat those three as Mild Steel
# library data.
#
# This is not SS316L and it is not a measured SS400 card. Park's coupon is
# SS400; the Ansys body that produced the 3.4 x 1.6 mm fusion contour is this
# Mild Steel table.
name: Mild Steel
status: calibrated
source: "Ansys Mechanical 2024 R2 Engineering Data, Mild Steel, Deposit_Study MatML / ds.dat matid 1"

constants:
  k: 53.33                 # W/m·K at 20 °C (first KXX knot)
  rho: 7850.0              # kg/m^3, constant in the Ansys card
  cp: 650.0                # J/kg·K plateau from 900 °C through 2000 °C
  alpha: 1.461e-5          # m^2/s at 20 °C using k=53.33 and cp=465.1
  T_solidus: 1753.15       # 1480 °C
  T_liquidus: 1793.15      # 1520 °C
  L_fusion: 260000.0       # J/kg, enthalpy jump 1480->1520 °C with the 650 J/kg·K slope removed
  gamma_0: 1.943           # N/m, Sahoo 1988 pure Fe; not in the Ansys card
  dgamma_dT: -4.3e-4       # N/m·K, Sahoo 1988 pure-Fe slope; not in the Ansys card
  T_ref_gamma: 1793.15
  mu: 0.0067               # Pa·s, Ansys MP,VISC, constant
  beta_T: 1.2e-4           # 1/K, twin default; buoyancy is off in the thermal job

tables:
  # [T_K, value]. Each cp pair holds the enthalpy slope flat across one Ansys interval.
  cp:
    - [293.15, 465.1]      # 20 °C
    - [373.10, 465.1]      # -> 100 °C
    - [373.15, 509.8]      # 100 °C
    - [473.10, 509.8]      # -> 200 °C
    - [473.15, 547.3]      # 200 °C
    - [573.10, 547.3]
    - [573.15, 584.2]      # 300 °C
    - [673.10, 584.2]
    - [673.15, 634.0]      # 400 °C
    - [773.10, 634.0]
    - [773.15, 709.9]      # 500 °C
    - [873.10, 709.9]
    - [873.15, 783.0]      # 600 °C
    - [923.10, 783.0]
    - [923.15, 884.4]      # 650 °C
    - [973.10, 884.4]
    - [973.15, 1151.8]     # 700 °C
    - [993.10, 1151.8]
    - [993.15, 2219.2]     # 720 °C
    - [1008.10, 2219.2]
    - [1008.15, 2396.1]    # 735 °C
    - [1023.10, 2396.1]
    - [1023.15, 1004.6]    # 750 °C
    - [1073.10, 1004.6]
    - [1073.15, 704.6]     # 800 °C
    - [1173.10, 704.6]
    - [1173.15, 650.0]     # 900 °C through 2000 °C, melt latent heat excluded
    - [2273.15, 650.0]
  k:
    - [293.15, 53.33]      # 20 °C
    - [373.15, 50.67]      # 100
    - [473.15, 47.34]      # 200
    - [573.15, 44.01]      # 300
    - [673.15, 40.68]      # 400
    - [773.15, 37.35]      # 500
    - [873.15, 34.02]      # 600
    - [923.15, 32.35]      # 650
    - [973.15, 30.69]      # 700
    - [993.15, 30.02]      # 720
    - [1008.15, 29.52]     # 735
    - [1023.15, 29.02]     # 750
    - [1073.15, 27.3]      # 800
    - [1173.15, 27.3]      # 900
    - [1273.15, 27.3]      # 1000
    - [1373.15, 27.3]      # 1100
    - [1473.15, 27.3]      # 1200
    - [1573.15, 27.3]      # 1300
    - [1673.15, 27.3]      # 1400
    - [1753.15, 27.3]      # 1480
    - [1773.15, 27.3]      # 1500
    - [1793.15, 27.3]      # 1520
    - [1873.15, 27.3]      # 1600
    - [2073.15, 27.3]      # 1800
    - [2273.15, 27.3]      # 2000, held above 2000 °C

surface:
  contact_angle_deg: 90.0

notes: >
  Plate card for the conduction comparison. k is the 25-point Ansys curve.
  cp is the enthalpy slope on those same intervals; the 260 kJ/kg melt jump
  is L_fusion, not a 7150 J/kg·K spike. Wire stays ER70S-6. With wire feed 0
  the only metal is this plate.
