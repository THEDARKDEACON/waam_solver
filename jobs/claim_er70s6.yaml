# Shared claim fragment for ER70S-6 mesh-locked calibrate / held-outs.
# Copied into jobs (YAML has no include) — keep in sync when editing policy.
# Set mesh_tier / notes per job (shop vs hpc).
mesh_tier: shop
# absolute_wd true only after auto_calibrate re-fit to Park 2019 flat (DOI 10.3390/app9214626)
absolute_wd: false
trend_only: false
tier_label: engineering_trend_predictor
pool_metric: fusion_zone
characterisation: >
  Qualitatively predictive; quantitatively usable to roughly ±20–25% pool W/D
  at the training process point on the declared mesh tier, degrading
  off-calibration. Bead geometry is only partly physics-emergent: deposition
  footprint and trailing solidify are geometric priors. Primary W/D is liquidus
  T_max fusion envelope (f_l bbox secondary). Thermal advection is minmod-limited.
  Shop uses SRT+variable-τ; HPC uses two-rate MRT+variable-τ (force/mass unit-tested).
  CSF toe uses solid-aware stencils. Liquid-steel μ implies τ near 0.5 at lock dx —
  Ma/force clamps can limit the run. C_darcy is the lock-mesh lattice value at
  C_darcy_ref_dt_s (C_eff ∝ dt). Fitted knobs are mesh-tier locked; prefer
  --fit-set eta. Engineering-grade process trend predictor, not continuum
  mesh-independent truth.
operating_regime: >
  Handbook liquid-steel ν (μ/ρ from ER70S-6.v1) → τ≈0.5 at shop/HPC dx; design Ma
  via u_mach_limit_lu / auto_dt_ma. Level A mesh studies require force and Mach
  clamps inactive. Do not treat η/Goldak as portable across collision operators.
accuracy:
  T_peak: "moderate when calibrated; Goldak/η absorb arc plasma uncertainty"
  pool_width: "moderate at lock mesh with fusion metric; ±15–25% typical"
  pool_depth: "similar to width; sulphur/Sahoo sensitive"
  bead_height: "low absolute, moderate trends with WFS; deposition priors dominate"
  marangoni_velocity: "order-of-magnitude / sign; better with variable-τ"
  HAZ: "moderate; slightly conservative spread"
  porosity: "qualitative tracers only"
knobs_fitted:
  - eta
  # Legacy full fit set — prefer auto_calibrate --fit-set eta (Phase 3 / Level B path)
  - goldak_axes
  - evap_cooling_scale
  - recoil_accommodation
knobs_predicted:
  - lin_eagar_p0  # only when arc_physics.pressure_sigma_mm set separately from heat σ
  - cc_Psat_shape  # after R_spec_vapor ≈ 149 J/kg·K (Fe vapour)
  - sahoo_dgamma
  - lorentz_JxB
  - carman_kozeny_form  # continuum form; C_eff = C_darcy·(dt/C_darcy_ref_dt_s)
knobs_locked:
  - marangoni_scale
  - C_darcy
  - C_darcy_ref_dt_s
  - superheat_K
  - footprint_sigma_scale
  - contact_angle_deg
  - pressure_sigma_mm
  - trailing_solidify_lookback_mm
  - trailing_solidify_temp_margin_K
  - R_spec_vapor_J_kgK
known_defects: []
limitations:
  - fl_bbox_overestimate_secondary
  - mesh_dependent_fitted_knobs
  - operator_splitting_lag
  - lorentz_per_step_skip_possible
  - force_ablation_sensitivity_uncertain
  - residual_phi_fl_one_way_sync
  - deposition_footprint_and_trailing_solidify_priors
  - clamp_limited_regime_possible
out_of_scope:
  - mushy_turbulence
  - pinch_droplet_detachment
  - arc_plasma_shielding
  - oxide_film
  - keyhole_cavity_collapse
  - residual_stress_FEA
notes: >
  Park 2019 flat calibrate lock (DOI 10.3390/app9214626). absolute_wd false until
  re-fit after fingerprint changes. Do not copy knobs across shop/HPC.
