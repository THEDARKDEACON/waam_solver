# Lock H2: Lorentz cold-start Jacobi is capped at max(job_iters, 8·n_max, 20),
# not 2·n_max². Override with advanced_physics.lorentz_jacobi_cold_iters.
name: lock_lorentz_cold_start
simulation:
  preset: minimal
  backend: cpu
  physics_tier: full
  domain_mm: [32, 16, 16]
  dx_mm: 1.0
  enable_lorentz: true
  enable_vof: false
  enable_recoil: false
  enable_gas_shear: false
  strict_mode: false
plate:
  thickness_mm: 4.0
  size_mm: [24, 12]
material: materials/placeholders/ER70S-6.yaml
process:
  current_A: 180
  voltage_V: 20
  T_ambient_K: 300
advanced_physics:
  lorentz_jacobi_iters: 40
  lorentz_jacobi_tol: 1.0e-4
model_reference:
  n_max: 32
  job_iters: 40
  max_cold_iters: 256
