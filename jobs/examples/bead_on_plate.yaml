# =============================================================================
# Bead-on-plate — interactive (mirrors bead_calibrate; prefer calibrate for gates)
# =============================================================================
# Geometry lives here (not in config/presets.yaml). Hardware --preset selects
# collision model and tracer count. It does not change plate size or dx.
#
# Physics settings follow jobs/examples/bead_calibrate.yaml (free-surface LBM,
# Mach-limited dt, physical force cap). The legacy VOF free surface this job
# used to run on blows up to NaN around 0.1 s now that body forces are applied
# at full strength (TRT forcing fix) — do not switch use_free_surface_lbm off.
# =============================================================================

simulation:
  preset: high
  backend: cuda
  physics_tier: full
  # domain derived from plate + margin if omitted; explicit keeps path room:
  domain_mm: [80, 80, 25]
  # 0.25 mm: 320×320×100 = 10.2 M cells, ~3.2 GB on the GPU dense, ~0.3 s/step
  # on an RTX 3050 (dt 25 µs → 1 s of weld ≈ 40 000 steps). 0.5 mm is ~8× fewer
  # cells for quick looks.
  dx_mm: 0.25
  enable_vof: true
  use_free_surface_lbm: true
  # Sparse grid (GPU only): compute only near metal. At this dx the plate alone
  # needs a pool above the 1 GB default — start with WAAM_DEVICE_MEMORY_GB=2.5
  # (or the viewer's --sparse with that variable set).
  sparse_grid: false
  enable_csf_tension: true
  enable_wetting: true
  enable_hydrostatic_gravity: true
  enable_bead_freeze: true
  enable_trailing_solidify: false
  enable_droplet_impact_pressure: true
  enable_recoil: true
  use_recoil_clausius_clapeyron: true
  enable_lorentz: true
  enable_gas_shear: true
  enable_enthalpy_cap: true
  enable_evaporative_cooling: true
  arc_surface_weighting: true
  # Interactive: keep running past warnings (blow-ups are still detected and
  # reported). bead_calibrate uses strict_mode: true.
  strict_mode: false
  dt_scale: 1.0
  use_variable_tau: true
  use_srt: false
  # Stability: dt chosen so u_design_m_s sits at the Mach limit; forces capped
  # at a physical acceleration (mesh-invariant).
  auto_dt_ma: true
  u_design_m_s: 0.5
  u_mach_limit_lu: 0.08
  force_limit_lu: 0.05
  force_limit_m_s2: 12500.0
  warn_on_force_clamp: true
  C_darcy: 160000.0
  C_darcy_ref_dt_s: 4.0e-05

plate:
  thickness_mm: 10.0
  size_mm: [60, 60]   # coupon L×W (mm) — this is the square you should see from +Z
  material: materials/validated/SS316L.v1.yaml  # optional; omit → same as wire

material: materials/validated/ER70S-6.v1.yaml
calibration: null
torch_path_csv: jobs/paths/bead_line.csv

heat_source: goldak
goldak:
  ff: 0.6
  fr: 1.4
  a_front_mm: 2.2
  a_rear_mm: 4.2
  b_mm: 3.0
  c_mm: 1.5

arc_physics:
  sigma_mm: 2.0
  penetration_mm: 2.1
  T_vapor_cap_K: 3200.0
  surface_weighting: true
  pressure_model: lin_eagar
  pressure_pa: 150.0
  pressure_sigma_mm: 2.0

advanced_physics:
  evap_cooling_scale: 1.0
  T_boiling_K: 3000.0
  recoil_accommodation: 0.25
  L_vapor_J_kg: 6.0e6
  R_spec_vapor_J_kgK: 149.0   # iron vapour: 8.314 / 0.0558 kg/mol
  lorentz_jacobi_iters: 300
  lorentz_jacobi_tol: 1.0e-3
  lorentz_solve_every_s: 2.5e-4
  sigma_liquid_Sm: 1.0e6
  sigma_solid_Sm: 1.0e5
  gas_jet_velocity_m_s: 12.0
  gas_shear_coeff: 1.0
  marangoni_scale: 1.0

process:
  current_A: 200
  voltage_V: 23
  arc_efficiency: 0.72
  travel_speed_mm_s: 10
  wire_feed_m_min: 4.0
  wire_diameter_mm: 1.2
  droplet_length_mm: 3.0
  T_ambient_K: 293
  stickout_mm: 12.0
  ctwd_mm: 15.0
  transfer_mode: auto
  droplet_size_jitter: 0.05
  impact_lead_angle_deg: 5.0
  power_factor: 1.0
  duty_cycle: 1.0

deposition:
  superheat_K: 400.0
  footprint_sigma_scale: 1.0
  trailing_solidify_lookback_mm: 6.0
  trailing_solidify_temp_margin_K: 10.0

surface_wetting:
  contact_angle_deg: 80.0

heat_loss:
  convection: true
  radiation: true
  h_conv: 35.0

#reference:
#  pool_width_mm: 7.0
#  pool_depth_mm: 3.0
#  source: macrograph_ER70S-6_bead_on_plate
#
#model_reference:
#  pool_width_mm: 6.8
#  pool_depth_mm: 3.2
#  n_steps: 8000

probes:
  z_ref: plate_bottom
  sample_every_ms: 1.0       # 0 = every step (stalls the GPU pipeline)
  points:
    - name: substrate_behind_arc
      x_mm: 20.0
      y_mm: 10.0
      z_mm: 2.0
    # Rides the torch. bead_line.csv travels +Y, so this sits at y_torch − 10 mm.
    - name: trail_10mm
      behind_mm: 10.0
      z_mm: 2.0
    # Thermocouple model example (uncomment to compare with a real TC):
    # - name: tc_mid
    #   x_mm: 40.0
    #   y_mm: 44.0
    #   z_mm: 7.0
    #   bead_diameter_mm: 0.5
    #   time_constant_ms: 20
    #   position_tolerance_mm: 0.5
