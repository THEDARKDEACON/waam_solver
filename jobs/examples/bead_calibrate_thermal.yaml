# =============================================================================
# Park flat — conduction-only Goldak, for the Ansys 2024 R2 comparison
# =============================================================================
# Same heat source and power as the fitted lock in bead_calibrate.yaml
# (91 A × 22 V × 0.82 = 1642 W, Goldak 2.0 / 3.8 / 2.8 / 2.6 mm).
# Ansys on this source melted 3.4 mm wide and 1.6 mm deep (1520 °C).
#
# physics_tier: thermal turns the flow off. The enable_* lines below are
# repeated on purpose: the loader applies those flags AFTER the tier, so a
# copied `true` from bead_on_plate_hires.yaml would switch the flow back on.
#
# Wire feed is 0 so no droplet enthalpy is added on top of the 1642 W.
# energy_split stays at its default (off): the ellipsoid receives the full
# η·V·I. The ~600 W arc split starved the pool and is not this job.
# Surface weighting is off so the watts fill the ellipsoid instead of being
# piled on the free surface.
#
# Path jobs/paths/bead_line.csv is (30,20,0) → (30,40,0), 20 mm at 10 mm/s,
# the same line as the Ansys plate. z_mm = 0 is the plate-top face (Ansys ZTOP),
# not one cell under it. Plate origin is the corner, 60 × 60 × 9 mm.
# dx = 0.4 mm is the shop spacing the Goldak lock was fitted on.
#
# plate.material is the Ansys body: Engineering Data "Mild Steel"
# (k 53.3 to 27.3 W/m.K, rho=7850, enthalpy latent 260 kJ/kg, 1480-1520 C).
# The wire card stays ER70S-6. Wire feed is 0, so that card is not deposited.
# SS316L is a different alloy and is not this plate.
# =============================================================================

simulation:
  preset: standard
  backend: cuda
  physics_tier: thermal
  domain_mm: [70, 70, 14]
  dx_mm: 0.4
  strict_mode: true
  # Path z_mm = 0 sits on the plate-top face. Without this, z is ignored and
  # the Goldak origin stays on the last metal cell, one dx under the face.
  use_torch_z: true

  # Flow and free surface — off. Thermal tier sets these; listed so a later
  # edit cannot inherit `true` from a full-physics job.
  enable_vof: false
  enable_csf_tension: false
  enable_wetting: false
  enable_hydrostatic_gravity: false
  enable_bead_freeze: false
  enable_trailing_solidify: false
  enable_droplet_impact_pressure: false
  enable_recoil: false
  use_recoil_clausius_clapeyron: false
  enable_lorentz: false
  enable_gas_shear: false
  enable_marangoni: false
  enable_buoyancy: false
  enable_arc_pressure: false

  # Energy leaves only by the convection and radiation block below.
  enable_enthalpy_cap: false
  enable_evaporative_cooling: false
  arc_surface_weighting: false

plate:
  thickness_mm: 9.0
  size_mm: [60, 60]
  origin_mm: [0, 0]
  material: materials/validated/MildSteel.ansys.v1.yaml

material: materials/validated/ER70S-6.v1.yaml
calibration: null
torch_path_csv: jobs/paths/bead_line.csv

heat_source: goldak
goldak:
  ff: 0.6
  fr: 1.4
  a_front_mm: 2.0
  a_rear_mm: 3.8
  b_mm: 2.8
  c_mm: 2.6

arc_physics:
  sigma_mm: 2.0
  penetration_mm: 2.1
  T_vapor_cap_K: 3200.0
  surface_weighting: false          # loader applies this AFTER simulation.*; keep false
  pressure_model: constant
  pressure_pa: 0.0
  pressure_sigma_mm: 2.0

advanced_physics:
  evap_cooling_scale: 1.0
  T_boiling_K: 3000.0
  recoil_accommodation: 0.25
  L_vapor_J_kg: 6.0e6
  R_spec_vapor_J_kgK: 149.0
  lorentz_jacobi_iters: 300
  lorentz_jacobi_tol: 0.001
  sigma_liquid_Sm: 1.0e6
  sigma_solid_Sm: 1.0e5
  gas_jet_velocity_m_s: 0.0
  gas_shear_coeff: 0.0
  marangoni_scale: 0.0

process:
  current_A: 91
  voltage_V: 22.0
  arc_efficiency: 0.82
  power_factor: 1.0
  duty_cycle: 1.0
  travel_speed_mm_s: 10.0
  wire_feed_m_min: 0.0              # no droplets; Goldak carries the whole 1642 W
  wire_diameter_mm: 1.0
  droplet_length_mm: 2.5
  T_ambient_K: 293
  stickout_mm: 12.0
  ctwd_mm: 15.0
  transfer_mode: auto
  droplet_size_jitter: 0.0
  impact_lead_angle_deg: 0.0

deposition:
  superheat_K: 0.0
  footprint_sigma_scale: 1.0
  trailing_solidify_lookback_mm: 6.0
  trailing_solidify_temp_margin_K: 10.0

surface_wetting:
  contact_angle_deg: 90.0

heat_loss:
  convection: true
  radiation: true
  h_conv: 35.0
  eps_rad: 0.4

probes:
  - name: substrate_behind_arc
    x_mm: 20.0
    y_mm: 10.0
    z_mm: 2.0

reference:
  awaiting_measurement: false
  gate: macro_wd
  pool_width_mm: 6.1
  pool_depth_mm: 1.8
  bead_height_mm: 2.2
  source: park_appl_sci_2019_doi_10.3390/app9214626_flat
  note: >
    Conduction check against Ansys, not a Park fit. Ansys fusion on this
    Goldak was 3.4 mm wide and 1.6 mm deep. The plate is the Ansys Mild Steel
    card, not SS316L and not the ER70S-6 wire. Score T >= 1520 °C at mid-bead.
