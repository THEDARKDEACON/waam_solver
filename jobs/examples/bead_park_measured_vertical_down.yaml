# MEASURED ELECTRICAL INPUT (11 Nov 2026): Park et al. 2019 Fig. 8b welding signals,
# digitised over 7 pulse periods (docs/validation/data/park2019_waveforms/):
# I_mean 138.2 A, I_rms 178.4 A, U_mean 19.44 V,
# mean(U*I) 3260 W (period-to-period sd 84 W).
# The rectangular 345/35 A train (I_mean 91 A) with a guessed 22 V under-stated
# the power by ~20 %; the real pulse has ramps and a ~95 A post-pulse shoulder.
# arc_efficiency is calibrated on the flat bead only (sweep_park_measured.yaml).
# =============================================================================
# Park 2019 VERTICAL-DOWN bead - held-out (gravity along travel)
# =============================================================================
# Park P-GMAW physics with an honest energy budget (energy_split: arc +
# droplets = eta*mean(U*I); mean power V*I_mean + R(I_rms^2 - I_mean^2)) and a
# Goldak volume fixed to the torch (heat_anchor: torch), standing in for the
# arc/droplet digging the surface model cannot yet resolve
# (docs/PARK_PHYSICS_CHECK.md). Shape from the measured flat bead (b = W/2 = 3.0,
# c = 2.6 mm); the effective arc efficiency is the only fitted value, on the
# flat bead only (jobs/calibration/sweep_park_goldak.yaml). Park's voltage is
# not tabulated, so eta_eff carries the uncertainty of eta*mean(U*I).
# Held-out: only simulation.welding_position differs from the flat job.
# =============================================================================
simulation:
  preset: standard
  backend: cuda
  physics_tier: full
  domain_mm:
  - 80
  - 40
  - 25
  dx_mm: 0.4
  enable_vof: true
  use_free_surface_lbm: true
  enable_csf_tension: true
  enable_wetting: true
  enable_hydrostatic_gravity: true
  enable_bead_freeze: true
  enable_trailing_solidify: false
  enable_droplet_impact_pressure: true
  enable_recoil: true
  use_recoil_clausius_clapeyron: true
  enable_lorentz: true
  enable_gas_shear: true
  enable_enthalpy_cap: true
  enable_evaporative_cooling: true
  arc_surface_weighting: true
  strict_mode: true
  dt_scale: 1.0
  use_variable_tau: true
  use_srt: false
  auto_dt_ma: true
  u_design_m_s: 0.5
  u_mach_limit_lu: 0.08
  force_limit_lu: 0.05
  C_darcy: 160000.0
  C_darcy_ref_dt_s: 4.0e-05
  warn_on_force_clamp: true
  force_limit_m_s2: 12500.0
  energy_split: true
  welding_position: vertical_down
plate:
  thickness_mm: 9.0
  size_mm:
  - 50
  - 20
material: materials/validated/ER70S-6.v1.yaml
torch_path_csv: jobs/paths/bead_calibrate.csv
heat_source: goldak
arc_physics:
  sigma_mm: 2.0
  T_vapor_cap_K: 3200.0
  pressure_model: lin_eagar
  pressure_pa: 150.0
  heat_anchor: torch
advanced_physics:
  evap_cooling_scale: 1.0
  T_boiling_K: 3000.0
  recoil_accommodation: 0.25
  L_vapor_J_kg: 6.0e6
  R_spec_vapor_J_kgK: 149.0
  lorentz_jacobi_iters: 300
  lorentz_jacobi_tol: 0.001
  lorentz_solve_every_s: 0.00025
  sigma_liquid_Sm: 1.0e6
  sigma_solid_Sm: 1.0e5
  gas_jet_velocity_m_s: 12.0
  gas_shear_coeff: 1.0
  marangoni_scale: 1.0
process:
  voltage_V: 19.44
  current_A: 138.2
  current_rms_A: 178.4
  mean_power_W: 3260
  arc_efficiency: 0.82
  travel_speed_mm_s: 10.0
  wire_feed_m_min: 7.0
  wire_diameter_mm: 1.0
  droplet_length_mm: 2.5
  T_ambient_K: 293
  stickout_mm: 12.0
  ctwd_mm: 15.0
  transfer_mode: pulsed
  droplet_size_jitter: 0.05
  impact_lead_angle_deg: 5.0
  power_factor: 1.0
  duty_cycle: 1.0
  pulse_frequency_hz: 151.5
  pulse_peak_A: 345.0
  pulse_base_A: 35.0
  pulse_peak_ms: 1.2
  arc_slope_ohm: 0.05
deposition:
  superheat_K: 400.0
  footprint_sigma_scale: 1.0
  trailing_solidify_lookback_mm: 6.0
  trailing_solidify_temp_margin_K: 10.0
surface_wetting:
  contact_angle_deg: 80.0
heat_loss:
  convection: true
  radiation: true
  h_conv: 35.0
reference:
  citation_doi: 10.3390/app9214626
  citation_url: https://www.mdpi.com/2076-3417/9/21/4626
  material_match: true
  experimental_wire: ER70S-6_1.0mm
  awaiting_measurement: false
  gate: macro_wd
  pool_width_mm: 6.9
  pool_depth_mm: 0.8
  bead_height_mm: 1.8
  position: vertical_down
  source: park_appl_sci_2019_vertical_down
goldak:
  ff: 0.6
  fr: 1.4
  a_front_mm: 2.0
  a_rear_mm: 3.8
  b_mm: 3.0
  c_mm: 2.6
