# =============================================================================
# Bead-on-plate — higher-resolution HPC production run
# =============================================================================
# Same process / physics as bead_on_plate.yaml, finer mesh for GPU workstations
# and HPC interactive shells. Path is short (jobs/paths/bead_line.csv ≈ 20 mm).
#
# Requested dx = 0.01 mm. auto_grid (default on) coarsens dx to the preset
# budget. Set simulation.auto_grid: false or pass --no-auto-grid to keep dx_mm.
# On OOM: use --preset high (default below) or shrink domain_mm — do not jump
# to ultra until high succeeds.
# =============================================================================

simulation:
  preset: ultra
  backend: cuda
  physics_tier: full
  domain_mm: [100, 100, 25]
  dx_mm: 0.01
  # auto_grid: false   # keep dx_mm; preset VRAM/max_cells cap is not applied
  enable_vof: true
  enable_csf_tension: true
  enable_wetting: true
  enable_hydrostatic_gravity: true
  enable_bead_freeze: true
  enable_droplet_impact_pressure: true
  enable_recoil: true
  use_recoil_clausius_clapeyron: true
  enable_lorentz: true
  enable_gas_shear: true
  enable_enthalpy_cap: true
  enable_evaporative_cooling: true
  arc_surface_weighting: true
  strict_mode: true

plate:
  thickness_mm: 10.0
  size_mm: [50, 50]

material: materials/placeholders/ER70S-6.yaml
calibration: null
torch_path_csv: jobs/paths/bead_line.csv

heat_source: goldak
goldak:
  ff: 0.6
  fr: 1.4
  a_front_mm: 2.2
  a_rear_mm: 4.2
  b_mm: 3.0
  c_mm: 1.5

arc_physics:
  sigma_mm: 2.0
  penetration_mm: 2.1
  T_vapor_cap_K: 3200.0
  surface_weighting: true
  pressure_model: lin_eagar
  pressure_pa: 150.0

advanced_physics:
  evap_cooling_scale: 25.0
  T_boiling_K: 3000.0
  recoil_accommodation: 0.25
  L_vapor_J_kg: 6.0e6
  R_spec_vapor_J_kgK: 450.0
  lorentz_jacobi_iters: 300
  lorentz_jacobi_tol: 1.0e-3
  sigma_liquid_Sm: 1.0e6
  sigma_solid_Sm: 1.0e5
  gas_jet_velocity_m_s: 12.0
  gas_shear_coeff: 1.0

process:
  current_A: 131
  voltage_V: 13.4
  arc_efficiency: 0.72
  travel_speed_mm_s: 10
  wire_feed_m_min: 4.0
  wire_diameter_mm: 1.2
  droplet_length_mm: 3.0
  T_ambient_K: 293
  stickout_mm: 12.0
  ctwd_mm: 15.0
  transfer_mode: auto
  droplet_size_jitter: 0.05
  impact_lead_angle_deg: 5.0

deposition:
  superheat_K: 400.0
  footprint_sigma_scale: 1.0
  trailing_solidify_lookback_mm: 6.0
  trailing_solidify_temp_margin_K: 10.0

surface_wetting:
  contact_angle_deg: 80.0

heat_loss:
  convection: true
  radiation: true
  h_conv: 35.0

probes:
  - name: substrate_behind_arc
    x_mm: 20.0
    y_mm: 10.0
    z_mm: 2.0
