# =============================================================================
# Ansys width trial — conduction-only Goldak
# =============================================================================
# Replicates the Ansys Mechanical solve opened 20 Oct 2026 (solve.out written
# 19 Oct, integrated power about 1,939,000 mW). That run is not the 2802 °C
# baseline. jobs/examples/bead_calibrate_thermal.yaml stays on 22 V, b=2.8,
# c=2.6.
#
# Changed from the baseline, and only these:
#   voltage 22 V -> 26 V, so 0.82*91*26 = 1940.12 W
#   Goldak b 2.8 mm -> 5.0 mm
#   Goldak c 2.6 mm -> 3.0 mm
# af, ar, ff, fr, travel, path, and the flat 9 mm plate are the same.
# Ansys Maximum Over Time on this trial peaked at 2076.5 °C. The mid-bead
# depth path peaked at 2014 °C.
#
# Same thermal setup as bead_calibrate_thermal.yaml: flow off, wire feed 0,
# plate is the Ansys Mild Steel card, source origin on the plate face.
# The mid-bead probe is (30, 30, 7) mm from the plate bottom, 2 mm under the
# Ansys top face. On the baseline depth table that station was 1192 °C.
# =============================================================================

simulation:
  preset: standard
  backend: cuda
  physics_tier: thermal
  domain_mm: [70, 70, 14]
  dx_mm: 0.4
  strict_mode: true
  # Path z_mm = 0 is the plate-top face (index nz_solid).
  use_torch_z: true

  enable_vof: false
  enable_csf_tension: false
  enable_wetting: false
  enable_hydrostatic_gravity: false
  enable_bead_freeze: false
  enable_trailing_solidify: false
  enable_droplet_impact_pressure: false
  enable_recoil: false
  use_recoil_clausius_clapeyron: false
  enable_lorentz: false
  enable_gas_shear: false
  enable_marangoni: false
  enable_buoyancy: false
  enable_arc_pressure: false

  enable_enthalpy_cap: false
  enable_evaporative_cooling: false
  arc_surface_weighting: false

plate:
  thickness_mm: 9.0
  size_mm: [60, 60]
  origin_mm: [0, 0]
  material: materials/validated/MildSteel.ansys.v1.yaml

material: materials/validated/ER70S-6.v1.yaml
calibration: null
torch_path_csv: jobs/paths/bead_line.csv

heat_source: goldak
goldak:
  ff: 0.6
  fr: 1.4
  a_front_mm: 2.0
  a_rear_mm: 3.8
  b_mm: 5.0
  c_mm: 3.0
  normalize_energy: true   # metal-only rescale (historical twin); abs job sets false

arc_physics:
  sigma_mm: 2.0
  penetration_mm: 2.1
  T_vapor_cap_K: 3200.0
  surface_weighting: false
  pressure_model: constant
  pressure_pa: 0.0
  pressure_sigma_mm: 2.0

advanced_physics:
  evap_cooling_scale: 1.0
  T_boiling_K: 3000.0
  recoil_accommodation: 0.25
  L_vapor_J_kg: 6.0e6
  R_spec_vapor_J_kgK: 149.0
  lorentz_jacobi_iters: 300
  lorentz_jacobi_tol: 0.001
  sigma_liquid_Sm: 1.0e6
  sigma_solid_Sm: 1.0e5
  gas_jet_velocity_m_s: 0.0
  gas_shear_coeff: 0.0
  marangoni_scale: 0.0

process:
  current_A: 91
  voltage_V: 26.0
  arc_efficiency: 0.82
  power_factor: 1.0
  duty_cycle: 1.0
  travel_speed_mm_s: 10.0
  wire_feed_m_min: 0.0              # no droplets; Goldak carries the whole 1940 W
  wire_diameter_mm: 1.0
  droplet_length_mm: 2.5
  T_ambient_K: 293
  stickout_mm: 12.0
  ctwd_mm: 15.0
  transfer_mode: auto
  droplet_size_jitter: 0.0
  impact_lead_angle_deg: 0.0

deposition:
  superheat_K: 0.0
  footprint_sigma_scale: 1.0
  trailing_solidify_lookback_mm: 6.0
  trailing_solidify_temp_margin_K: 10.0

surface_wetting:
  contact_angle_deg: 90.0

heat_loss:
  convection: true
  radiation: true
  h_conv: 35.0
  eps_rad: 0.4

probes:
  - name: substrate_mid_bead
    x_mm: 30.0
    y_mm: 30.0
    z_mm: 7.0
  - name: substrate_behind_arc
    x_mm: 20.0
    y_mm: 10.0
    z_mm: 2.0

reference:
  awaiting_measurement: true
  gate: macro_wd
  pool_width_mm: 6.1
  pool_depth_mm: 1.8
  bead_height_mm: 2.2
  source: ansys_2024r2_width_trial_26V_b5_c3
  note: >
    Match the Ansys width trial, not the 2802 °C baseline and not Park.
    Power is 1940.12 W. Goldak b is 5 mm and c is 3 mm. Ansys Maximum
    Over Time peaked at 2076.5 °C. Score T >= 1520 °C at mid-bead.
    Let the run continue past 2 s so the mid-bead probe cools through 7 s.
