# Calibration of the Park physics job (honest energy split, corrected pulsed
# power, gravity direction) against Park et al. 2019 flat P-GMAW.
# Run with tools/calib_sweep.py (plan → run → fit → validate).
#
# Material parameters are never fitted: dγ/dT stays on the material card
# (Sahoo, S 28 ppm — the S sensitivity at 28/100/150 ppm moved D by < 0.1 mm).
# One value is fitted: the effective arc efficiency η_eff (Park's voltage is
# not tabulated, so η·mean(U·I) is the uncertain input; see params below).
# W, D and H are all compared; with one parameter the fit is over-determined.
#
# The Goldak volume (fixed to the torch) stands in for the arc/droplet
# digging the surface heat source cannot reproduce yet
# (docs/PARK_PHYSICS_CHECK.md).
#
# Held-out tests (never used in the fit), all measured:
#   park_overhead       same process, gravity +z         W 5.7 D 1.9 H 2.5
#   park_vertical_down  same process, gravity along travel W 6.9 D 0.8 H 1.8
#   bruno_gmaw          other process (110 A steady, 6 mm/s, 6 mm plate)
#                       bead W 4.33 H 2.14 (no depth)

points:
  - name: park_flat
    job: jobs/examples/bead_park_goldak.yaml

heldout:
  - name: park_overhead
    job: jobs/examples/bead_park_goldak_overhead.yaml
  - name: park_vertical_down
    job: jobs/examples/bead_park_goldak_vertical_down.yaml
  - name: bruno_gmaw
    job: jobs/examples/bead_bruno_goldak.yaml
    time_s: 4.0             # 6 mm/s: torch 13-17 mm past the window at 4 s

params:
  # History: Goldak b/c sweeps (runs/calibration/sweep_park_goldak_range1/2.jsonl)
  # showed D saturating at ~1.2 mm for any shape with the honest energy budget;
  # anchoring the source to the torch gave 1.3 mm. Depth is energy-limited,
  # and Park's voltage is not tabulated, so the effective arc efficiency is
  # the one fitted value (shape fixed from the measured bead: b 3.0, c 2.6).
  # Physical window of eta*mean(U*I): ~1.9-2.7 kW (eta 0.75-0.88, V 20-26 V)
  # → eta_eff 0.70-0.99 at the 22 V estimate. A fit above that is reported as
  # compensating for missing physics, not hidden.
  eta: [0.90, 1.20]

n: 6
seed: 11
time_s: 2.5
x0: 22.0
x1: 26.0

measurement_sigma:
  abs_mm: 0.15
  rel: 0.05
model_discrepancy_rel: 0.05

out: runs/calibration/sweep_park_goldak.jsonl
